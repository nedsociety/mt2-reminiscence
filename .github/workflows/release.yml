name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${tag} must look like v1.2.3" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the plugin
        shell: bash
        run: |
          dotnet build src/Reminiscence/Reminiscence.csproj \
            --configuration Release \
            --output dist/plugin \
            -p:Version="${{ steps.version.outputs.version }}" \
            -p:MT2_ROOT= \
            --nologo
          rm -f dist/plugin/*.pdb

      - name: Build the extractor
        shell: bash
        run: |
          python -m pip install --requirement tools/extractor/requirements.txt
          python tools/extractor/build_exe.py --dist dist/extractor
          cp dist/extractor/ReminiscenceExtract.exe dist/plugin/

      - name: Pack the Thunderstore zip
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          website="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          sed -i \
            -e "s|^versionNumber = .*|versionNumber = \"${version}\"|" \
            -e "s|^websiteUrl = .*|websiteUrl = \"${website}\"|" \
            thunderstore.toml
          dotnet tool install --global tcli
          tcli build
          cp dist/*-Reminiscence-"${version}".zip "Reminiscence-${version}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: Reminiscence-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
