[config]
schemaVersion = "0.0.1"

[package]
namespace = "nedsociety"
name = "Reminiscence"
versionNumber = "0.0.0"
description = "Monster Train 1 field and boss music for Monster Train 2."
websiteUrl = "https://github.com"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./dist"

[[build.copy]]
source = "./dist/plugin"
target = "BepInEx/plugins/Reminiscence"

[publish]
repository = "https://thunderstore.io"
communities = [ "monster-train-2" ]
